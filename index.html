<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de Etiquetas</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--s:#1a1d27;--b:#2a2d3a;--a:#00d4aa;--t:#e2e4ed;--m:#666a80;--err:#ff4757;--warn:#ffa726}
  html,body{height:100%;background:var(--bg);color:var(--t);font-family:'IBM Plex Sans',sans-serif;font-size:13px;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;padding:12px;gap:10px}
  .hdr{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--b)}
  .hdr-ico{width:28px;height:28px;background:var(--a);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .hdr-ico svg{width:16px;height:16px;fill:var(--bg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--m);margin-left:auto;transition:background .3s}
  .dot.ok{background:var(--a);box-shadow:0 0 6px var(--a)}.dot.err{background:var(--err)}
  .lbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin-bottom:5px}
  input,select{width:100%;background:var(--s);border:1px solid var(--b);border-radius:6px;color:var(--t);padding:7px 10px;font-family:inherit;font-size:12px;outline:none}
  input:focus,select:focus{border-color:var(--a)}input::placeholder{color:var(--m)}
  select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
  select option,select optgroup{background:var(--s);color:var(--t)}
  select optgroup{font-style:normal;font-weight:500;color:var(--m);font-size:11px}
  .hint{font-size:10px;color:var(--m);margin-top:5px;font-family:'IBM Plex Mono',monospace;word-break:break-all;line-height:1.4}
  .hint b{color:var(--a);font-weight:500}
  .sel-box{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .cnt{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--a);min-width:30px}
  .cnt.z{color:var(--m)}.sl{font-size:11px;color:var(--m)}.sd{font-size:11px;color:var(--t);font-family:'IBM Plex Mono',monospace}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;transition:all .15s}
  .btn-p{background:var(--a);color:var(--bg);width:100%}.btn-p:hover{background:#00efc0;transform:translateY(-1px)}
  .btn-p:disabled{background:var(--b);color:var(--m);cursor:not-allowed;transform:none}
  .btn-s{background:var(--s);color:var(--t);border:1px solid var(--b);width:100%}.btn-s:hover{border-color:var(--a);color:var(--a)}
  .auto-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px}
  .tog{position:relative;width:32px;height:18px;flex-shrink:0}
  .tog input{display:none}.tog-t{position:absolute;inset:0;background:var(--b);border-radius:9px;cursor:pointer;transition:background .2s}
  .tog input:checked+.tog-t{background:var(--a)}.tog-th{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
  .tog input:checked~.tog-th{transform:translateX(14px)}
  .badge{font-size:9px;background:var(--a);color:var(--bg);padding:1px 5px;border-radius:3px;display:none;animation:pulse 1.5s infinite}
  .badge.on{display:block}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .status{margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.4;color:var(--m);padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px;min-height:32px;display:flex;align-items:center;word-break:break-word}
  .status.ok{color:var(--a);border-color:rgba(0,212,170,.35)}
  .status.err{color:var(--err);border-color:rgba(255,71,87,.35)}
  .status.info{color:var(--warn)}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-ico"><svg viewBox="0 0 24 24"><path d="M3 5h2V3H3v2zm0 8h2v-2H3v2zm0 8h2v-2H3v2zm4-4h14v-2H7v2zm0-8v2h14V9H7zm0-6v2h14V3H7z"/></svg></div>
    <div><div style="font-weight:500;font-size:13px">Creador de Etiquetas</div><div style="font-size:10px;color:var(--m);font-family:'IBM Plex Mono',monospace">Extensión de Trimble Connect</div></div>
    <div class="dot" id="dot"></div>
  </div>

  <div>
    <div class="lbl">Propiedad IFC del modelo</div>
    <select id="prop"><option value="__id__">ID (objectRuntimeId)</option></select>
    <input id="custom" placeholder="Nombre exacto de la propiedad…" style="display:none;margin-top:6px">
    <div class="hint" id="hint">Selecciona una pieza para leer sus propiedades.</div>
  </div>

  <div><div class="lbl">Selección actual</div>
    <div class="sel-box">
      <div class="cnt z" id="cnt">0</div>
      <div><div class="sl">objetos seleccionados</div><div class="sd" id="sd">—</div></div>
    </div>
  </div>

  <div class="auto-row">
    <label class="tog"><input type="checkbox" id="auto"><div class="tog-t"></div><div class="tog-th"></div></label>
    <span style="font-size:11px;flex:1">Modo automático</span>
    <span class="badge" id="badge">ACTIVO</span>
  </div>

  <button class="btn btn-p" id="btnC" disabled>Crear etiquetas</button>
  <button class="btn btn-s" id="btnR">↻ Actualizar propiedades</button>

  <div class="status" id="status">Conectando…</div>
</div>
<script>
(function(){
  'use strict';

  var ID_OPT = '__id__', CUSTOM_OPT = '__custom__';

  var API = null, sel = [], autoOn = false, lastIds = '', selTimer = null, running = false;
  var available = [];   // propiedades reales leidas del objeto seleccionado
  var userPicked = false;   // el usuario ya eligio una propiedad a mano

  var $ = function(id){ return document.getElementById(id); };
  var dot = $('dot'), cnt = $('cnt'), sd = $('sd'), btnC = $('btnC'),
      propSel = $('prop'), custom = $('custom'), hint = $('hint'), status = $('status');

  function setStatus(msg, type){
    status.textContent = msg;
    status.className = 'status' + (type ? ' ' + type : '');
  }
  function errMsg(e){ return (e && e.message) ? e.message : String(e); }

  // -- Interfaz ----------------------------------------------------
  function updUI(){
    var n = sel.length;
    cnt.textContent = n;
    cnt.className = 'cnt' + (n === 0 ? ' z' : '');
    btnC.disabled = n === 0 || !API || running;
    sd.textContent = n === 0 ? '—' : n === 1 ? '1 objeto' : n + ' objetos';
  }

  // -- Selección ---------------------------------------------------
  function parseSel(data){
    var out = [];
    var items = data || [];
    if (!Array.isArray(items)) items = [items];
    for (var i = 0; i < items.length; i++){
      var item = items[i];
      if (!item) continue;
      var ids = item.objectRuntimeIds || (item.objectRuntimeId != null ? [item.objectRuntimeId] : []);
      for (var j = 0; j < ids.length; j++){
        out.push({ modelId: item.modelId, rid: ids[j] });
      }
    }
    return out;
  }

  // -- Lectura de propiedades --------------------------------------
  // Aplana la respuesta de getObjectProperties en entradas {set, name, value}.
  function flatten(node, setName, out, depth){
    if (node == null || depth > 8) return;
    if (Array.isArray(node)){
      for (var i = 0; i < node.length; i++) flatten(node[i], setName, out, depth + 1);
      return;
    }
    if (typeof node !== 'object') return;
    var nm = typeof node.name === 'string' ? node.name : null;
    var isContainer = false;
    if (Array.isArray(node.properties)){ isContainer = true; flatten(node.properties, nm || setName, out, depth + 1); }
    if (Array.isArray(node.propertySets)){ isContainer = true; flatten(node.propertySets, nm || setName, out, depth + 1); }
    if (Array.isArray(node.attributes)){ isContainer = true; flatten(node.attributes, nm || setName, out, depth + 1); }
    if (nm && !isContainer && ('value' in node || 'displayValue' in node || 'nominalValue' in node)){
      var v = node.displayValue != null ? node.displayValue
            : node.value != null ? node.value
            : node.nominalValue;
      out.push({ set: setName || 'General', name: nm, value: v });
    }
  }

  function fmtVal(v){
    if (v == null) return null;
    if (typeof v === 'object'){
      if ('value' in v) return fmtVal(v.value);
      if ('displayValue' in v) return fmtVal(v.displayValue);
      return null;
    }
    if (typeof v === 'number'){
      if (!isFinite(v)) return null;
      return String(Math.round(v * 1000) / 1000);
    }
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    var s = String(v).trim();
    return s.length ? s : null;
  }

  async function readEntries(modelId, rid){
    var props = await API.viewer.getObjectProperties(modelId, [rid]);
    var entries = [];
    flatten(props, null, entries, 0);
    var seen = {}, out = [];
    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      e.qualified = e.set + '/' + e.name;
      if (seen[e.qualified.toLowerCase()]) continue;
      seen[e.qualified.toLowerCase()] = 1;
      out.push(e);
    }
    return out;
  }

  // Rellena el desplegable con las propiedades que realmente tiene el modelo.
  function rebuildSelect(entries){
    var prev = propSel.value;
    propSel.innerHTML = '';

    var o = document.createElement('option');
    o.value = ID_OPT; o.textContent = 'ID (objectRuntimeId)';
    propSel.appendChild(o);

    var groups = [], byName = {};
    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      if (!byName[e.set]){ byName[e.set] = []; groups.push(e.set); }
      byName[e.set].push(e);
    }
    for (var g = 0; g < groups.length; g++){
      var og = document.createElement('optgroup');
      og.label = groups[g];
      var list = byName[groups[g]];
      for (var k = 0; k < list.length; k++){
        var op = document.createElement('option');
        op.value = list[k].qualified;
        op.textContent = list[k].name;
        og.appendChild(op);
      }
      propSel.appendChild(og);
    }

    var oc = document.createElement('option');
    oc.value = CUSTOM_OPT; oc.textContent = 'Personalizada…';
    propSel.appendChild(oc);

    // Conserva la eleccion del usuario si sigue existiendo en el nuevo objeto.
    var keep = false;
    if (userPicked){
      for (var q = 0; q < propSel.options.length; q++){
        if (propSel.options[q].value === prev){ propSel.value = prev; keep = true; break; }
      }
    }
    // Si aun no ha elegido nada, arranca en la primera propiedad real del modelo.
    if (!keep) propSel.value = entries.length ? entries[0].qualified : ID_OPT;
    updHint();
  }

  function currentEntry(){
    var v = propSel.value;
    for (var i = 0; i < available.length; i++){
      if (available[i].qualified === v) return available[i];
    }
    return null;
  }

  function updHint(){
    var v = propSel.value;
    custom.style.display = v === CUSTOM_OPT ? '' : 'none';

    if (v === ID_OPT){ hint.textContent = 'Se usa el identificador interno de cada pieza.'; return; }
    if (v === CUSTOM_OPT){ hint.textContent = 'Escribe el nombre exacto tal y como aparece en el modelo.'; return; }

    var e = currentEntry();
    if (!e){ hint.textContent = ''; return; }
    var val = fmtVal(e.value);
    hint.innerHTML = '';
    hint.appendChild(document.createTextNode(e.set + ' · valor actual: '));
    var b = document.createElement('b');
    b.textContent = val === null ? '(vacío)' : val;
    hint.appendChild(b);
  }

  // Lee las propiedades reales de la primera pieza seleccionada.
  async function loadProps(announce){
    if (!API || !sel.length){
      available = [];
      rebuildSelect([]);
      hint.textContent = 'Selecciona una pieza para leer sus propiedades.';
      return;
    }
    try {
      available = await readEntries(sel[0].modelId, sel[0].rid);
      rebuildSelect(available);
      if (announce){
        setStatus(available.length
          ? available.length + ' propiedades leídas del modelo.'
          : 'La pieza no expone propiedades legibles.', available.length ? 'ok' : 'info');
      }
    } catch(e){
      available = [];
      rebuildSelect([]);
      setStatus('No se pudieron leer las propiedades: ' + errMsg(e), 'err');
    }
  }

  // -- Posición 3D: centro del bounding box ------------------------
  function num(v){ return typeof v === 'number' ? v : Number(v); }

  async function readCenter(modelId, rid){
    var boxes = await API.viewer.getObjectBoundingBoxes(modelId, [rid]);
    var arr = Array.isArray(boxes) ? boxes : [boxes];
    var entry = null;
    for (var i = 0; i < arr.length; i++){
      if (arr[i] && (String(arr[i].id) === String(rid) || String(arr[i].objectRuntimeId) === String(rid))){ entry = arr[i]; break; }
    }
    // Solo se da por buena la primera caja cuando la respuesta trae exactamente
    // una. Si trae varias y ninguna coincide con el objeto pedido, coger arr[0]
    // pondria todas las etiquetas en el mismo punto sin avisar de nada.
    if (!entry){
      if (arr.length === 1) entry = arr[0];
      else throw new Error('la caja devuelta no corresponde al objeto ' + rid);
    }
    var bb = entry.boundingBox || entry.bbox || entry;
    var min = bb && bb.min, max = bb && bb.max;
    if (!min || !max) throw new Error('bounding box sin min/max');
    var c = {
      x: (num(min.x) + num(max.x)) / 2,
      y: (num(min.y) + num(max.y)) / 2,
      z: (num(min.z) + num(max.z)) / 2
    };
    if (!isFinite(c.x) || !isFinite(c.y) || !isFinite(c.z)) throw new Error('coordenadas no numéricas');
    return c;
  }

  function markupApi(){
    if (API && API.markup && typeof API.markup.addTextMarkup === 'function') return API.markup;
    if (API && API.viewer && API.viewer.markup && typeof API.viewer.markup.addTextMarkup === 'function') return API.viewer.markup;
    return null;
  }

  // Identificador unico por etiqueta. Sin el, todas comparten el mismo id vacio
  // y el visor las colapsa en una sola: cada nueva reemplaza a la anterior.
  function uid(){
    try {
      if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    } catch(e){}
    return 'mk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  // Cuenta las etiquetas que existen de verdad, para no fiarnos solo de que la
  // llamada no lanzara error. Devuelve null si el host no expone ningun lector.
  async function countMarkups(mk){
    var fns = ['getMarkups', 'getTextMarkups', 'getAllMarkups'];
    for (var i = 0; i < fns.length; i++){
      if (typeof mk[fns[i]] === 'function'){
        try {
          var r = await mk[fns[i]]();
          if (Array.isArray(r)) return r.length;
        } catch(e){}
      }
    }
    return null;
  }

  // Busca en un objeto el mismo nombre de propiedad elegido en el desplegable.
  function matchValue(entries, target){
    var tq = target.toLowerCase();
    var tn = target.indexOf('/') >= 0 ? target.slice(target.indexOf('/') + 1).toLowerCase() : tq;
    var i, e;
    for (i = 0; i < entries.length; i++){          // 1o: coincidencia exacta Pset/Propiedad
      e = entries[i];
      if (String(e.qualified).toLowerCase() === tq){
        var v = fmtVal(e.value);
        if (v !== null) return v;
      }
    }
    for (i = 0; i < entries.length; i++){          // 2o: mismo nombre en otro property set
      e = entries[i];
      if (String(e.name).toLowerCase() === tn){
        var v2 = fmtVal(e.value);
        if (v2 !== null) return v2;
      }
    }
    return null;
  }

  // -- Creación de etiquetas ---------------------------------------
  async function doCreate(){
    if (!API || sel.length === 0 || running) return;

    var mode = propSel.value;
    var target = mode === CUSTOM_OPT ? custom.value.trim() : mode;
    if (mode === CUSTOM_OPT && !target){
      setStatus('Escribe el nombre de la propiedad personalizada.', 'err');
      return;
    }

    var mk = markupApi();
    if (!mk){
      setStatus('La API de markup no está disponible: no existe API.markup.addTextMarkup.', 'err');
      return;
    }

    running = true;
    updUI();
    setStatus('Creando ' + sel.length + ' etiqueta(s)…', 'info');

    var antes = await countMarkups(mk);

    var markups = [], meta = [], errPrep = 0, sinProp = 0;
    var centros = {}, repetidas = 0;

    for (var i = 0; i < sel.length; i++){
      var obj = sel[i];
      try {
        // Cada vuelta lee SIEMPRE las propiedades y la caja de SU propio objeto.
        var label = null;
        if (mode === ID_OPT){
          label = String(obj.rid);
        } else {
          try {
            label = matchValue(await readEntries(obj.modelId, obj.rid), target);
          } catch(e){
            label = null;
          }
        }
        if (label === null || label === ''){
          label = 'ID: ' + obj.rid;
          sinProp++;
        }

        var c = await readCenter(obj.modelId, obj.rid);
        var clave = c.x + '|' + c.y + '|' + c.z;
        if (centros[clave]) repetidas++; else centros[clave] = 1;

        markups.push({
          id: uid(),
          text: label,
          start: { positionX: c.x, positionY: c.y, positionZ: c.z, modelId: obj.modelId, objectId: obj.rid },
          end:   { positionX: c.x, positionY: c.y, positionZ: c.z, modelId: obj.modelId, objectId: obj.rid },
          color: { r: 0, g: 212, b: 170, a: 255 }
        });
        meta.push(label);
      } catch(e){
        errPrep++;
      }
    }

    var ok = 0, errEnvio = 0, ultimoError = '';
    if (markups.length){
      try {
        await mk.addTextMarkup(markups);
        ok = markups.length;
      } catch(e){
        ultimoError = errMsg(e);
        // El lote falló: una a una, para no perder las que sí valen.
        for (var k = 0; k < markups.length; k++){
          try {
            await mk.addTextMarkup([markups[k]]);
            ok++;
          } catch(e2){
            // Ultimo recurso por si este host rechaza un id propio.
            try {
              var sinId = {};
              for (var p in markups[k]) if (p !== 'id') sinId[p] = markups[k][p];
              await mk.addTextMarkup([sinId]);
              ok++;
            } catch(e3){
              errEnvio++;
              ultimoError = errMsg(e3);
            }
          }
        }
      }
    }

    // Cuenta lo que hay de verdad en el modelo, no lo que la API acepto.
    var despues = await countMarkups(mk);
    var reales = (antes !== null && despues !== null) ? (despues - antes) : null;

    var fallos = errPrep + errEnvio;
    var msg;
    if (reales !== null){
      msg = reales + ' de ' + sel.length + ' etiquetas visibles';
      if (reales !== ok) msg += ' (la API aceptó ' + ok + ')';
    } else if (ok === 1 && fallos === 0){
      msg = 'Etiqueta creada: "' + meta[0] + '"';
    } else {
      msg = ok + ' enviadas, ' + fallos + ' fallo(s)';
    }
    if (sinProp) msg += ' · ' + sinProp + ' sin esa propiedad (se usó el ID)';
    if (repetidas) msg += ' · ⚠ ' + repetidas + ' comparten posición';
    if (ultimoError) msg += ' · ' + ultimoError;

    var mal = fallos > 0 || repetidas > 0 || (reales !== null && reales < sel.length);
    setStatus(msg, mal ? 'err' : sinProp ? 'info' : 'ok');

    running = false;
    updUI();
  }

  // -- Conexión ----------------------------------------------------
  function onEvent(ev, data){
    if (ev !== 'viewer.modelObject.selection') return;
    sel = parseSel(data);
    updUI();
    if (selTimer) clearTimeout(selTimer);
    selTimer = setTimeout(async function(){
      selTimer = null;
      await loadProps(false);
      if (!autoOn || !sel.length) return;
      var ids = sel.map(function(o){ return o.modelId + ':' + o.rid; }).join(',');
      if (ids === lastIds) return;
      lastIds = ids;
      doCreate();
    }, 500);
  }

  async function init(){
    try {
      API = await TrimbleConnectWorkspace.connect(window.parent, onEvent, 15000);
      dot.classList.add('ok');
      if (!markupApi()){
        setStatus('Conectado, pero la API de markup no está disponible.', 'err');
      } else {
        setStatus('Conectado. Selecciona una pieza.', 'ok');
      }
      try {
        sel = parseSel(await API.viewer.getSelection());
        updUI();
        await loadProps(false);
        if (sel.length) setStatus(sel.length + ' objeto(s) ya seleccionados.', 'ok');
      } catch(e){
        setStatus('No se pudo leer la selección: ' + errMsg(e), 'err');
      }
    } catch(e){
      dot.classList.add('err');
      setStatus('Error al conectar: ' + errMsg(e), 'err');
    }
    updUI();
  }

  // -- Eventos de interfaz -----------------------------------------
  propSel.addEventListener('change', function(){ userPicked = true; updHint(); });
  btnC.addEventListener('click', function(){ doCreate(); });
  $('btnR').addEventListener('click', async function(){
    if (!API) { setStatus('Sin conexión con Trimble Connect.', 'err'); return; }
    try {
      sel = parseSel(await API.viewer.getSelection());
      updUI();
      await loadProps(true);
    } catch(e){
      setStatus('Error al actualizar: ' + errMsg(e), 'err');
    }
  });
  $('auto').addEventListener('change', function(e){
    autoOn = e.target.checked;
    $('badge').classList.toggle('on', autoOn);
    lastIds = '';
    setStatus(autoOn ? 'Modo automático activado.' : 'Modo automático desactivado.', 'info');
  });

  window.addEventListener('error', function(e){
    setStatus('Error de JavaScript: ' + (e.message || 'desconocido'), 'err');
  });

  init();
})();
</script>
</body>
</html>
