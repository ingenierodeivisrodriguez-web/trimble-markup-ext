<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de Etiquetas</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--s:#1a1d27;--b:#2a2d3a;--a:#00d4aa;--t:#e2e4ed;--m:#666a80;--err:#ff4757;--warn:#ffa726}
  html,body{height:100%;background:var(--bg);color:var(--t);font-family:'IBM Plex Sans',sans-serif;font-size:13px;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;padding:12px;gap:9px;overflow-y:auto}
  .hdr{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--b);flex-shrink:0}
  .hdr-ico{width:28px;height:28px;background:var(--a);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .hdr-ico svg{width:16px;height:16px;fill:var(--bg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--m);margin-left:auto;transition:background .3s}
  .dot.ok{background:var(--a);box-shadow:0 0 6px var(--a)}.dot.err{background:var(--err)}
  .lbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin-bottom:5px}
  input[type=text],input[type=number]{width:100%;background:var(--s);border:1px solid var(--b);border-radius:6px;color:var(--t);padding:7px 10px;font-family:inherit;font-size:12px;outline:none}
  input:focus{border-color:var(--a)}input::placeholder{color:var(--m)}
  .cfg{display:flex;gap:8px;align-items:flex-end}
  .cfg>div{flex:1}
  .cfg-color{flex:0 0 auto;width:46px}
  input[type=color]{width:46px;height:33px;padding:2px;background:var(--s);border:1px solid var(--b);border-radius:6px;cursor:pointer}
  .props{background:var(--s);border:1px solid var(--b);border-radius:8px;max-height:168px;overflow-y:auto;padding:4px}
  .grp{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--m);padding:6px 6px 3px;font-weight:500}
  .pr{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px;cursor:pointer;line-height:1.3}
  .pr:hover{background:rgba(255,255,255,.04)}
  .pr input{margin:0;accent-color:var(--a);flex-shrink:0;cursor:pointer}
  .pr-n{font-size:11px;flex:1;word-break:break-word}
  .pr-v{font-size:10px;color:var(--m);font-family:'IBM Plex Mono',monospace;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .vacio{color:var(--m);font-size:11px;padding:10px 6px;text-align:center}
  .prev{background:var(--s);border:1px dashed var(--b);border-radius:6px;padding:7px 9px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--a);white-space:pre-wrap;word-break:break-word;max-height:66px;overflow-y:auto;line-height:1.45}
  .sel-box{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px}
  .cnt{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--a);min-width:26px}
  .cnt.z{color:var(--m)}.sl{font-size:11px;color:var(--m)}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;transition:all .15s;width:100%;flex-shrink:0}
  .btn-p{background:var(--a);color:var(--bg)}.btn-p:hover{background:#00efc0}
  .btn-p:disabled{background:var(--b);color:var(--m);cursor:not-allowed}
  .btn-s{background:var(--s);color:var(--t);border:1px solid var(--b)}.btn-s:hover{border-color:var(--a);color:var(--a)}
  .btn-d{background:transparent;color:var(--err);border:1px solid rgba(255,71,87,.5)}.btn-d:hover{background:var(--err);color:#fff}
  .row{display:flex;gap:6px}
  .auto-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px}
  .tog{position:relative;width:32px;height:18px;flex-shrink:0}
  .tog input{display:none}.tog-t{position:absolute;inset:0;background:var(--b);border-radius:9px;cursor:pointer;transition:background .2s}
  .tog input:checked+.tog-t{background:var(--a)}.tog-th{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
  .tog input:checked~.tog-th{transform:translateX(14px)}
  .badge{font-size:9px;background:var(--a);color:var(--bg);padding:1px 5px;border-radius:3px;display:none}
  .badge.on{display:block}
  .status{font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.45;color:var(--m);padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px;min-height:32px;max-height:150px;overflow-y:auto;display:block;word-break:break-word;white-space:pre-wrap;user-select:text;flex-shrink:0}
  .status.ok{color:var(--a);border-color:rgba(0,212,170,.35)}
  .status.err{color:var(--err);border-color:rgba(255,71,87,.35)}
  .status.info{color:var(--warn)}
  hr{border:none;border-top:1px solid var(--b);flex-shrink:0}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-ico"><svg viewBox="0 0 24 24"><path d="M3 5h2V3H3v2zm0 8h2v-2H3v2zm0 8h2v-2H3v2zm4-4h14v-2H7v2zm0-8v2h14V9H7zm0-6v2h14V3H7z"/></svg></div>
    <div><div style="font-weight:500;font-size:13px">Creador de Etiquetas</div><div style="font-size:10px;color:var(--m);font-family:'IBM Plex Mono',monospace" id="ver">Extensión de Trimble Connect</div></div>
    <div class="dot" id="dot"></div>
  </div>

  <div>
    <div class="lbl">Configuración del texto</div>
    <div class="cfg">
      <div>
        <input type="number" id="size" min="6" max="96" step="1" value="16" title="Tamaño de letra">
      </div>
      <div class="cfg-color">
        <input type="color" id="color" value="#00d4aa" title="Color de letra">
      </div>
    </div>
  </div>

  <div>
    <div class="lbl">Parámetros de la etiqueta</div>
    <div class="props" id="props"><div class="vacio">Selecciona una pieza para ver sus parámetros.</div></div>
    <div class="row" style="margin-top:6px">
      <input type="text" id="custom" placeholder="Añadir parámetro por nombre exacto…">
      <button class="btn btn-s" id="btnAdd" style="width:auto;padding:7px 12px">+</button>
    </div>
  </div>

  <div>
    <div class="lbl">Vista previa</div>
    <div class="prev" id="prev">—</div>
  </div>

  <div class="sel-box">
    <div class="cnt z" id="cnt">0</div>
    <div class="sl" id="sd">nada seleccionado</div>
  </div>

  <div class="auto-row">
    <label class="tog"><input type="checkbox" id="auto" checked><div class="tog-t"></div><div class="tog-th"></div></label>
    <span style="font-size:11px;flex:1">Etiquetar al hacer clic</span>
    <span class="badge on" id="badge">ACTIVO</span>
  </div>

  <button class="btn btn-p" id="btnC" disabled>Etiquetar selección</button>
  <div class="row">
    <button class="btn btn-s" id="btnR">↻ Recargar</button>
    <button class="btn btn-d" id="btnX">✕ Borrar etiquetas</button>
  </div>
  <button class="btn btn-s" id="btnD">🔍 Diagnóstico de markup</button>

  <div class="status" id="status">Conectando…</div>
</div>
<script>
(function(){
  'use strict';

  var VERSION = 'v9';
  var ID_OPT = '__id__';
  var LS = 'creadorEtiquetas.cfg';

  var API = null, sel = [], autoOn = true, lastIds = '', selTimer = null, running = false;
  var available = [];        // parametros reales de la pieza seleccionada
  var elegidos = [];         // parametros marcados por el usuario (persisten)
  var extras = [];           // parametros anadidos a mano por nombre exacto
  var creados = [];          // ids de los markups que hemos creado nosotros

  var $ = function(id){ return document.getElementById(id); };
  var dot = $('dot'), cnt = $('cnt'), sd = $('sd'), btnC = $('btnC'),
      propsBox = $('props'), prev = $('prev'), status = $('status'),
      inpSize = $('size'), inpColor = $('color');

  function setStatus(msg, type){
    status.textContent = msg;
    status.className = 'status' + (type ? ' ' + type : '');
  }
  function errMsg(e){ return (e && e.message) ? e.message : String(e); }

  // -- Configuracion persistente (se define una vez) ---------------
  function guardarCfg(){
    try {
      localStorage.setItem(LS, JSON.stringify({
        size: inpSize.value, color: inpColor.value, elegidos: elegidos, extras: extras
      }));
    } catch(e){}
  }
  function cargarCfg(){
    try {
      var c = JSON.parse(localStorage.getItem(LS) || '{}');
      if (c.size) inpSize.value = c.size;
      if (c.color) inpColor.value = c.color;
      if (Array.isArray(c.elegidos)) elegidos = c.elegidos;
      if (Array.isArray(c.extras)) extras = c.extras;
    } catch(e){}
  }

  function colorRGBA(){
    var h = (inpColor.value || '#00d4aa').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return {
      r: parseInt(h.slice(0,2), 16) || 0,
      g: parseInt(h.slice(2,4), 16) || 0,
      b: parseInt(h.slice(4,6), 16) || 0,
      a: 255
    };
  }
  function tamano(){
    var n = parseInt(inpSize.value, 10);
    return (isFinite(n) && n > 0) ? n : null;
  }

  // -- Interfaz ----------------------------------------------------
  function updUI(){
    var n = sel.length;
    cnt.textContent = n;
    cnt.className = 'cnt' + (n === 0 ? ' z' : '');
    btnC.disabled = n === 0 || !API || running || elegidos.length === 0;
    sd.textContent = n === 0 ? 'nada seleccionado' : n === 1 ? '1 objeto seleccionado' : n + ' objetos seleccionados';
  }

  function marcado(q){ return elegidos.indexOf(q) >= 0; }

  function alternar(q, on){
    var i = elegidos.indexOf(q);
    if (on && i < 0) elegidos.push(q);
    if (!on && i >= 0) elegidos.splice(i, 1);
    guardarCfg();
    updPrev();
    updUI();
  }

  // Pinta la lista de parametros que la pieza tiene de verdad.
  function pintarProps(){
    propsBox.innerHTML = '';

    var filas = [{ set: 'General', name: 'ID (objectRuntimeId)', qualified: ID_OPT, value: sel.length ? sel[0].rid : null }];
    var i;
    for (i = 0; i < available.length; i++) filas.push(available[i]);
    for (i = 0; i < extras.length; i++){
      filas.push({ set: 'Añadidos a mano', name: extras[i], qualified: extras[i], value: valorExtra(extras[i]) });
    }

    var grupos = [], porGrupo = {};
    for (i = 0; i < filas.length; i++){
      var f = filas[i];
      if (!porGrupo[f.set]){ porGrupo[f.set] = []; grupos.push(f.set); }
      porGrupo[f.set].push(f);
    }

    for (var g = 0; g < grupos.length; g++){
      var tit = document.createElement('div');
      tit.className = 'grp';
      tit.textContent = grupos[g];
      propsBox.appendChild(tit);

      var lista = porGrupo[grupos[g]];
      for (var k = 0; k < lista.length; k++){
        (function(f){
          var fila = document.createElement('label');
          fila.className = 'pr';
          var chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = marcado(f.qualified);
          chk.addEventListener('change', function(){ alternar(f.qualified, chk.checked); });
          var nom = document.createElement('span');
          nom.className = 'pr-n';
          nom.textContent = f.name;
          var val = document.createElement('span');
          val.className = 'pr-v';
          var v = f.qualified === ID_OPT ? (f.value == null ? '' : String(f.value)) : fmtVal(f.value);
          val.textContent = v === null ? '' : v;
          fila.appendChild(chk); fila.appendChild(nom); fila.appendChild(val);
          propsBox.appendChild(fila);
        })(lista[k]);
      }
    }

    if (!available.length && !sel.length){
      propsBox.innerHTML = '<div class="vacio">Selecciona una pieza para ver sus parámetros.</div>';
    }
  }

  function valorExtra(nombre){
    var v = matchValue(available, nombre);
    return v;
  }

  // Texto de la etiqueta, en el orden en que aparecen los parametros.
  function lineasDe(entries, obj){
    var orden = [ID_OPT];
    var i;
    for (i = 0; i < available.length; i++) orden.push(available[i].qualified);
    for (i = 0; i < extras.length; i++) orden.push(extras[i]);
    // Cualquier elegido que no este en la lista visible tambien cuenta.
    for (i = 0; i < elegidos.length; i++) if (orden.indexOf(elegidos[i]) < 0) orden.push(elegidos[i]);

    var lineas = [];
    for (i = 0; i < orden.length; i++){
      var q = orden[i];
      if (!marcado(q)) continue;
      if (q === ID_OPT){ lineas.push(String(obj.rid)); continue; }
      var v = matchValue(entries, q);
      if (v !== null) lineas.push(v);
    }
    return lineas;
  }

  function updPrev(){
    if (!sel.length){ prev.textContent = '—'; return; }
    if (!elegidos.length){ prev.textContent = 'Marca al menos un parámetro.'; return; }
    var l = lineasDe(available, sel[0]);
    prev.textContent = l.length ? l.join('\n') : '(la pieza no tiene esos parámetros)';
  }

  // -- Selección ---------------------------------------------------
  function parseSel(data){
    var out = [];
    var items = data || [];
    if (!Array.isArray(items)) items = [items];
    for (var i = 0; i < items.length; i++){
      var item = items[i];
      if (!item) continue;
      var ids = item.objectRuntimeIds || (item.objectRuntimeId != null ? [item.objectRuntimeId] : []);
      for (var j = 0; j < ids.length; j++) out.push({ modelId: item.modelId, rid: ids[j] });
    }
    return out;
  }

  // -- Lectura de propiedades --------------------------------------
  function flatten(node, setName, out, depth){
    if (node == null || depth > 8) return;
    if (Array.isArray(node)){
      for (var i = 0; i < node.length; i++) flatten(node[i], setName, out, depth + 1);
      return;
    }
    if (typeof node !== 'object') return;
    var nm = typeof node.name === 'string' ? node.name : null;
    var isContainer = false;
    if (Array.isArray(node.properties)){ isContainer = true; flatten(node.properties, nm || setName, out, depth + 1); }
    if (Array.isArray(node.propertySets)){ isContainer = true; flatten(node.propertySets, nm || setName, out, depth + 1); }
    if (Array.isArray(node.attributes)){ isContainer = true; flatten(node.attributes, nm || setName, out, depth + 1); }
    if (nm && !isContainer && ('value' in node || 'displayValue' in node || 'nominalValue' in node)){
      var v = node.displayValue != null ? node.displayValue
            : node.value != null ? node.value
            : node.nominalValue;
      out.push({ set: setName || 'General', name: nm, value: v });
    }
  }

  function fmtVal(v){
    if (v == null) return null;
    if (typeof v === 'object'){
      if ('value' in v) return fmtVal(v.value);
      if ('displayValue' in v) return fmtVal(v.displayValue);
      return null;
    }
    if (typeof v === 'number'){
      if (!isFinite(v)) return null;
      return String(Math.round(v * 1000) / 1000);
    }
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    var s = String(v).trim();
    return s.length ? s : null;
  }

  async function readEntries(modelId, rid){
    var props = await API.viewer.getObjectProperties(modelId, [rid]);
    var entries = [];
    flatten(props, null, entries, 0);
    var seen = {}, out = [];
    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      e.qualified = e.set + '/' + e.name;
      if (seen[e.qualified.toLowerCase()]) continue;
      seen[e.qualified.toLowerCase()] = 1;
      out.push(e);
    }
    return out;
  }

  // Busca "Pset/Propiedad" y, si no, el mismo nombre en cualquier otro pset.
  function matchValue(entries, target){
    var tq = String(target).toLowerCase();
    var tn = target.indexOf('/') >= 0 ? target.slice(target.indexOf('/') + 1).toLowerCase() : tq;
    var i, e, v;
    for (i = 0; i < entries.length; i++){
      e = entries[i];
      if (String(e.qualified).toLowerCase() === tq){
        v = fmtVal(e.value);
        if (v !== null) return v;
      }
    }
    for (i = 0; i < entries.length; i++){
      e = entries[i];
      if (String(e.name).toLowerCase() === tn){
        v = fmtVal(e.value);
        if (v !== null) return v;
      }
    }
    return null;
  }

  async function loadProps(anunciar){
    if (!API || !sel.length){
      available = [];
      pintarProps(); updPrev();
      return;
    }
    try {
      available = await readEntries(sel[0].modelId, sel[0].rid);
      pintarProps(); updPrev();
      if (anunciar){
        setStatus(available.length + ' parámetros leídos de la pieza.', available.length ? 'ok' : 'info');
      }
    } catch(e){
      available = [];
      pintarProps(); updPrev();
      setStatus('No se pudieron leer los parámetros: ' + errMsg(e), 'err');
    }
  }

  // -- Posición 3D: centro del bounding box ------------------------
  function num(v){ return typeof v === 'number' ? v : Number(v); }

  async function readCenter(modelId, rid){
    var boxes = await API.viewer.getObjectBoundingBoxes(modelId, [rid]);
    var arr = Array.isArray(boxes) ? boxes : [boxes];
    var entry = null;
    for (var i = 0; i < arr.length; i++){
      if (arr[i] && (String(arr[i].id) === String(rid) || String(arr[i].objectRuntimeId) === String(rid))){ entry = arr[i]; break; }
    }
    if (!entry){
      if (arr.length === 1) entry = arr[0];
      else throw new Error('la caja devuelta no corresponde al objeto ' + rid);
    }
    var bb = entry.boundingBox || entry.bbox || entry;
    var min = bb && bb.min, max = bb && bb.max;
    if (!min || !max) throw new Error('bounding box sin min/max');
    var c = {
      x: (num(min.x) + num(max.x)) / 2,
      y: (num(min.y) + num(max.y)) / 2,
      z: (num(min.z) + num(max.z)) / 2
    };
    if (!isFinite(c.x) || !isFinite(c.y) || !isFinite(c.z)) throw new Error('coordenadas no numéricas');
    var dx = Math.abs(num(max.x) - num(min.x)),
        dy = Math.abs(num(max.y) - num(min.y)),
        dz = Math.abs(num(max.z) - num(min.z));
    var tam = Math.max(dx, dy, dz);
    c.sep = isFinite(tam) && tam > 0 ? tam * 0.35 : 0;
    c.topZ = num(max.z);
    if (!isFinite(c.topZ)) c.topZ = c.z;
    return c;
  }

  // -- API de markup -----------------------------------------------
  function markupApi(){
    if (API && API.markup && typeof API.markup.addTextMarkup === 'function') return API.markup;
    if (API && API.viewer && API.viewer.markup && typeof API.viewer.markup.addTextMarkup === 'function') return API.viewer.markup;
    return null;
  }

  async function leerMarkups(mk){
    var fns = ['getTextMarkups', 'getMarkups', 'getAllMarkups'];
    for (var i = 0; i < fns.length; i++){
      if (typeof mk[fns[i]] === 'function'){
        try {
          var r = await mk[fns[i]]();
          if (Array.isArray(r)) return r;
        } catch(e){}
      }
    }
    return null;
  }

  // Forma confirmada leyendo un markup guardado por este host:
  //   start/end -> { type:'point', positionX, positionY, positionZ }
  function pick(x, y, z){
    return { type: 'point', positionX: x, positionY: y, positionZ: z };
  }

  function construirMarkup(texto, c){
    var m = {
      text: texto,
      color: colorRGBA(),
      start: pick(c.x, c.y, c.z),
      end:   pick(c.x, c.y, c.topZ + c.sep)
    };
    var t = tamano();
    // El tamano de letra no aparece en el markup que devuelve el host, asi que
    // se envia en los dos nombres plausibles; si los ignora, lo avisamos.
    if (t){ m.size = t; m.fontSize = t; }
    return m;
  }

  function sinTamano(m){
    var o = {};
    for (var k in m) if (k !== 'size' && k !== 'fontSize') o[k] = m[k];
    return o;
  }

  function posDe(m){
    var p = m && (m.start || m.startPoint || m.position || m);
    if (!p || typeof p !== 'object') return null;
    var g = function(a, b){
      if (p[a] !== undefined && p[a] !== null) return p[a];
      if (p.position && p.position[b] !== undefined) return p.position[b];
      if (p[b] !== undefined && p[b] !== null) return p[b];
      return null;
    };
    var x = g('positionX','x'), y = g('positionY','y'), z = g('positionZ','z');
    if (x === null && y === null && z === null) return null;
    return [x, y, z].join(',');
  }

  // -- Etiquetado ---------------------------------------------------
  async function etiquetar(){
    if (!API || sel.length === 0 || running) return;
    if (!elegidos.length){ setStatus('Marca al menos un parámetro.', 'err'); return; }

    var mk = markupApi();
    if (!mk){ setStatus('La API de markup no está disponible.', 'err'); return; }

    running = true; updUI();
    setStatus('Etiquetando ' + sel.length + ' pieza(s)…', 'info');

    var antesArr = await leerMarkups(mk);
    var antes = antesArr === null ? null : antesArr.length;

    var markups = [], errPrep = 0, sinDatos = 0, centros = {}, repetidas = 0;

    for (var i = 0; i < sel.length; i++){
      var obj = sel[i];
      try {
        // Cada pieza lee SUS parametros y SU caja.
        var entries = [];
        try { entries = await readEntries(obj.modelId, obj.rid); } catch(e){ entries = []; }
        var lineas = lineasDe(entries, obj);
        if (!lineas.length){ lineas = ['ID: ' + obj.rid]; sinDatos++; }

        var c = await readCenter(obj.modelId, obj.rid);
        var clave = c.x + '|' + c.y + '|' + c.z;
        if (centros[clave]) repetidas++; else centros[clave] = 1;

        markups.push(construirMarkup(lineas.join('\n'), c));
      } catch(e){
        errPrep++;
      }
    }

    var ok = 0, errEnvio = 0, ultimoError = '';
    if (markups.length){
      try {
        await mk.addTextMarkup(markups);
        ok = markups.length;
      } catch(e){
        ultimoError = errMsg(e);
        for (var k = 0; k < markups.length; k++){
          try { await mk.addTextMarkup([markups[k]]); ok++; }
          catch(e2){
            // Por si el host rechaza los campos de tamano.
            try { await mk.addTextMarkup([sinTamano(markups[k])]); ok++; }
            catch(e3){ errEnvio++; ultimoError = errMsg(e3); }
          }
        }
      }
    }

    // Comprueba lo que el visor guardo de verdad.
    var guardados = await leerMarkups(mk);
    var despues = guardados === null ? null : guardados.length;
    var reales = (antes !== null && despues !== null) ? (despues - antes) : null;

    var avisoPos = '', avisoTam = '';
    if (guardados && guardados.length && markups.length){
      var nuestros = guardados.slice(-markups.length), k2;
      for (k2 = 0; k2 < nuestros.length; k2++){
        if (nuestros[k2] && nuestros[k2].id != null) creados.push(nuestros[k2].id);
      }
      var posSet = {}, nPos = 0;
      for (k2 = 0; k2 < nuestros.length; k2++){
        var pz = posDe(nuestros[k2]);
        if (pz === null) continue;
        if (!posSet[pz]){ posSet[pz] = 1; nPos++; }
      }
      if (nuestros.length > 1 && nPos <= 1){
        avisoPos = nPos === 1
          ? '\n⚠ el visor guardó 1 sola posición para las ' + nuestros.length + ': ' + posDe(nuestros[0])
          : '\n⚠ no se pudo leer la posición guardada.';
        avisoPos += '\nPulsa «Diagnóstico de markup» y envía el volcado.';
      }
      var u = nuestros[nuestros.length - 1];
      if (tamano() && u && u.size === undefined && u.fontSize === undefined){
        avisoTam = '\nNota: el visor no guardó el tamaño de letra (no lo admite en text markups).';
      }
    }

    var fallos = errPrep + errEnvio;
    var msg = (reales !== null)
      ? reales + ' de ' + sel.length + ' etiquetas creadas'
      : ok + ' enviadas, ' + fallos + ' fallo(s)';
    if (sinDatos) msg += ' · ' + sinDatos + ' sin esos parámetros (se usó el ID)';
    if (repetidas) msg += ' · ⚠ ' + repetidas + ' comparten posición';
    msg += avisoPos + avisoTam;
    if (ultimoError) msg += '\n' + ultimoError;

    var mal = fallos > 0 || repetidas > 0 || avisoPos !== '';
    setStatus(msg, mal ? 'err' : sinDatos ? 'info' : 'ok');

    running = false; updUI();
  }

  async function borrarEtiquetas(){
    var mk = markupApi();
    if (!mk){ setStatus('La API de markup no está disponible.', 'err'); return; }
    if (typeof mk.removeMarkups !== 'function'){
      setStatus('Este visor no expone removeMarkups. Bórralas desde la barra de markup de Trimble.', 'err');
      return;
    }
    try {
      if (creados.length) await mk.removeMarkups(creados.slice());
      else await mk.removeMarkups();
      setStatus('Etiquetas borradas.', 'ok');
      creados = [];
    } catch(e){
      setStatus('No se pudieron borrar: ' + errMsg(e), 'err');
    }
  }

  // -- Conexión -----------------------------------------------------
  function onEvent(ev, data){
    if (ev !== 'viewer.modelObject.selection') return;
    sel = parseSel(data);
    updUI();
    if (selTimer) clearTimeout(selTimer);
    selTimer = setTimeout(async function(){
      selTimer = null;
      await loadProps(false);
      if (!autoOn || !sel.length || !elegidos.length) return;
      var ids = sel.map(function(o){ return o.modelId + ':' + o.rid; }).join(',');
      if (ids === lastIds) return;
      lastIds = ids;
      etiquetar();
    }, 450);
  }

  async function init(){
    try {
      API = await TrimbleConnectWorkspace.connect(window.parent, onEvent, 15000);
      dot.classList.add('ok');
      setStatus(markupApi()
        ? 'Conectado. Marca los parámetros y haz clic en una pieza.'
        : 'Conectado, pero la API de markup no está disponible.', markupApi() ? 'ok' : 'err');
      try {
        sel = parseSel(await API.viewer.getSelection());
        updUI();
        await loadProps(false);
      } catch(e){
        setStatus('No se pudo leer la selección: ' + errMsg(e), 'err');
      }
    } catch(e){
      dot.classList.add('err');
      setStatus('Error al conectar: ' + errMsg(e), 'err');
    }
    updUI();
  }

  // -- Eventos ------------------------------------------------------
  inpSize.addEventListener('change', function(){ guardarCfg(); });
  inpColor.addEventListener('change', function(){ guardarCfg(); });

  $('btnAdd').addEventListener('click', function(){
    var v = $('custom').value.trim();
    if (!v) return;
    if (extras.indexOf(v) < 0) extras.push(v);
    if (elegidos.indexOf(v) < 0) elegidos.push(v);
    $('custom').value = '';
    guardarCfg(); pintarProps(); updPrev(); updUI();
  });
  $('custom').addEventListener('keydown', function(e){
    if (e.key === 'Enter') $('btnAdd').click();
  });

  btnC.addEventListener('click', function(){ etiquetar(); });
  $('btnX').addEventListener('click', function(){ borrarEtiquetas(); });

  $('btnR').addEventListener('click', async function(){
    if (!API){ setStatus('Sin conexión con Trimble Connect.', 'err'); return; }
    try {
      sel = parseSel(await API.viewer.getSelection());
      updUI();
      await loadProps(true);
    } catch(e){ setStatus('Error al recargar: ' + errMsg(e), 'err'); }
  });

  $('auto').addEventListener('change', function(e){
    autoOn = e.target.checked;
    $('badge').classList.toggle('on', autoOn);
    lastIds = '';
    setStatus(autoOn ? 'Se etiquetará al hacer clic en una pieza.' : 'Etiquetado manual: usa el botón.', 'info');
  });

  $('btnD').addEventListener('click', async function(){
    var mk = markupApi();
    if (!mk){ setStatus('No hay API de markup en este contexto.', 'err'); return; }
    setStatus('Leyendo markups guardados…', 'info');
    try {
      var guardados = await leerMarkups(mk);
      var partes = ['API.markup: ' + Object.keys(mk).join(', ')];
      if (guardados === null){
        partes.push('El host no expone ningún lector de markups.');
      } else if (!guardados.length){
        partes.push('No hay markups guardados. Crea una etiqueta y vuelve a pulsar.');
      } else {
        var ult = guardados[guardados.length - 1];
        partes.push('Total guardados: ' + guardados.length);
        partes.push('Claves del markup: ' + Object.keys(ult).join(', '));
        var lista = guardados.slice(-12), posSet = {}, nd = 0;
        partes.push('Posiciones guardadas (texto -> x,y,z):');
        for (var i = 0; i < lista.length; i++){
          var p = posDe(lista[i]);
          if (p !== null && !posSet[p]){ posSet[p] = 1; nd++; }
          partes.push('  "' + String(lista[i].text).replace(/\n/g, ' | ') + '" -> ' + (p === null ? '(ilegible)' : p));
        }
        partes.push(nd + ' posiciones distintas de ' + lista.length + ' etiquetas.');
      }
      setStatus(partes.join('\n'), 'info');
    } catch(e){
      setStatus('Diagnóstico falló: ' + errMsg(e), 'err');
    }
  });

  window.addEventListener('error', function(e){
    setStatus('Error de JavaScript: ' + (e.message || 'desconocido'), 'err');
  });

  cargarCfg();
  pintarProps();
  $('ver').textContent = 'Extensión de Trimble Connect · ' + VERSION;
  init();
})();
</script>
</body>
</html>
