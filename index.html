<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de Etiquetas</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--s:#1a1d27;--b:#2a2d3a;--a:#00d4aa;--t:#e2e4ed;--m:#666a80;--err:#ff4757;--warn:#ffa726}
  html,body{height:100%;background:var(--bg);color:var(--t);font-family:'IBM Plex Sans',sans-serif;font-size:13px;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;padding:12px;gap:9px;overflow-y:auto}
  .hdr{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--b);flex-shrink:0}
  .hdr-ico{width:28px;height:28px;background:var(--a);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .hdr-ico svg{width:16px;height:16px;fill:var(--bg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--m);margin-left:auto;transition:background .3s}
  .dot.ok{background:var(--a);box-shadow:0 0 6px var(--a)}.dot.err{background:var(--err)}
  .lbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin-bottom:5px}
  input[type=text],input[type=number]{width:100%;background:var(--s);border:1px solid var(--b);border-radius:6px;color:var(--t);padding:7px 10px;font-family:inherit;font-size:12px;outline:none}
  input:focus{border-color:var(--a)}input::placeholder{color:var(--m)}
  .cfg{display:flex;gap:8px;align-items:flex-end}
  .cfg>div{flex:1}
  .cfg-color{flex:0 0 auto;width:46px}
  input[type=color]{width:46px;height:33px;padding:2px;background:var(--s);border:1px solid var(--b);border-radius:6px;cursor:pointer}
  .props{background:var(--s);border:1px solid var(--b);border-radius:8px;max-height:168px;overflow-y:auto;padding:4px}
  .grp{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--m);padding:6px 6px 3px;font-weight:500}
  .pr{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px;cursor:pointer;line-height:1.3}
  .pr:hover{background:rgba(255,255,255,.04)}
  .pr input{margin:0;accent-color:var(--a);flex-shrink:0;cursor:pointer}
  .pr-n{font-size:11px;flex:1;word-break:break-word}
  .pr-v{font-size:10px;color:var(--m);font-family:'IBM Plex Mono',monospace;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .vacio{color:var(--m);font-size:11px;padding:10px 6px;text-align:center}
  .prev{background:var(--s);border:1px dashed var(--b);border-radius:6px;padding:7px 9px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--a);white-space:pre-wrap;word-break:break-word;max-height:66px;overflow-y:auto;line-height:1.45}
  .sel-box{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px}
  .cnt{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--a);min-width:26px}
  .cnt.z{color:var(--m)}.sl{font-size:11px;color:var(--m)}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;transition:all .15s;width:100%;flex-shrink:0}
  .btn-p{background:var(--a);color:var(--bg)}.btn-p:hover{background:#00efc0}
  .btn-p:disabled{background:var(--b);color:var(--m);cursor:not-allowed}
  .btn-s{background:var(--s);color:var(--t);border:1px solid var(--b)}.btn-s:hover{border-color:var(--a);color:var(--a)}
  .btn-d{background:transparent;color:var(--err);border:1px solid rgba(255,71,87,.5)}.btn-d:hover{background:var(--err);color:#fff}
  .row{display:flex;gap:6px}
  .auto-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px}
  .tog{position:relative;width:32px;height:18px;flex-shrink:0}
  .tog input{display:none}.tog-t{position:absolute;inset:0;background:var(--b);border-radius:9px;cursor:pointer;transition:background .2s}
  .tog input:checked+.tog-t{background:var(--a)}.tog-th{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
  .tog input:checked~.tog-th{transform:translateX(14px)}
  .badge{font-size:9px;background:var(--a);color:var(--bg);padding:1px 5px;border-radius:3px;display:none}
  .badge.on{display:block}
  .status{font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.45;color:var(--m);padding:8px 10px;background:var(--s);border:1px solid var(--b);border-radius:6px;min-height:32px;max-height:150px;overflow-y:auto;display:block;word-break:break-word;white-space:pre-wrap;user-select:text;flex-shrink:0}
  .status.ok{color:var(--a);border-color:rgba(0,212,170,.35)}
  .status.err{color:var(--err);border-color:rgba(255,71,87,.35)}
  .status.info{color:var(--warn)}
  hr{border:none;border-top:1px solid var(--b);flex-shrink:0}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-ico"><svg viewBox="0 0 24 24"><path d="M3 5h2V3H3v2zm0 8h2v-2H3v2zm0 8h2v-2H3v2zm4-4h14v-2H7v2zm0-8v2h14V9H7zm0-6v2h14V3H7z"/></svg></div>
    <div><div style="font-weight:500;font-size:13px">Creador de Etiquetas</div><div style="font-size:10px;color:var(--m);font-family:'IBM Plex Mono',monospace" id="ver">Extensión de Trimble Connect</div></div>
    <div class="dot" id="dot"></div>
  </div>

  <div>
    <div class="lbl">Color del texto</div>
    <div class="cfg">
      <div class="cfg-color">
        <input type="color" id="color" value="#00d4aa" title="Color de letra">
      </div>
      <div style="font-size:10px;color:var(--m);line-height:1.35">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:5px">
          <input type="checkbox" id="sinGuia" style="margin:0;accent-color:var(--a)">
          <span>Texto justo en el punto (sin línea guía)</span>
        </label>
        <select id="unidades" style="width:100%;background:var(--bg);border:1px solid var(--b);border-radius:5px;color:var(--t);padding:5px 7px;font-family:inherit;font-size:11px;outline:none;cursor:pointer">
          <option value="1000">Markup en milímetros (×1000)</option>
          <option value="1">Markup en metros (×1)</option>
          <option value="100">Markup en centímetros (×100)</option>
        </select>
      </div>
    </div>
  </div>

  <div>
    <div class="lbl">Parámetros de la etiqueta</div>
    <div class="props" id="props"><div class="vacio">Selecciona una pieza para ver sus parámetros.</div></div>
    <div class="row" style="margin-top:6px">
      <input type="text" id="custom" placeholder="Añadir parámetro por nombre exacto…">
      <button class="btn btn-s" id="btnAdd" style="width:auto;padding:7px 12px">+</button>
    </div>
  </div>

  <div>
    <div class="lbl">Vista previa</div>
    <div class="prev" id="prev">—</div>
  </div>

  <div class="sel-box">
    <div class="cnt z" id="cnt">0</div>
    <div class="sl" id="sd">nada seleccionado</div>
  </div>

  <div class="auto-row">
    <label class="tog"><input type="checkbox" id="auto" checked><div class="tog-t"></div><div class="tog-th"></div></label>
    <span style="font-size:11px;flex:1">Etiquetar al hacer clic</span>
    <span class="badge on" id="badge">ACTIVO</span>
  </div>

  <button class="btn btn-p" id="btnC" disabled>Etiquetar selección</button>
  <div class="row">
    <button class="btn btn-s" id="btnR">↻ Recargar</button>
    <button class="btn btn-d" id="btnX">✕ Borrar etiquetas</button>
  </div>
  <button class="btn btn-s" id="btnD">🔍 Diagnóstico de markup</button>

  <div class="status" id="status">Conectando…</div>
</div>
<script>
(function(){
  'use strict';

  var VERSION = 'v19';
  var ID_OPT = '__id__', CENTRO_OPT = '__centro__';
  var CLASS_OPT = '__class__', GUID_OPT = '__guid__', NAME_OPT = '__name__';
  var LS = 'creadorEtiquetas.cfg';

  var API = null, sel = [], autoOn = true, lastIds = '', selTimer = null, running = false;
  var selIds = '';           // firma de la seleccion ya procesada
  var pollTimer = null;      // sondeo periodico de la seleccion
  var eventos = [];          // nombres de eventos recibidos, para diagnostico
  var eventosDetalle = [];   // evento + carga util, para localizar el punto de clic
  var ultimoPick = null;     // punto 3D del ultimo clic sobre una superficie
  var ultimaSelCruda = null; // ultimo getSelection() sin procesar
  var centroActual = null;   // centro de la pieza mostrada en el panel
  var metaActual = null;     // CLASS / GUID / NAME de esa pieza
  var raizActual = null;     // respuesta cruda, para el diagnostico
  var available = [];        // parametros reales de la pieza seleccionada
  var elegidos = [];         // parametros marcados por el usuario (persisten)
  var extras = [];           // parametros anadidos a mano por nombre exacto
  var creados = [];          // ids de los markups que hemos creado nosotros
  var etiquetaDe = {};       // modelId:rid -> id del markup, para reemplazarlo

  var $ = function(id){ return document.getElementById(id); };
  var dot = $('dot'), cnt = $('cnt'), sd = $('sd'), btnC = $('btnC'),
      propsBox = $('props'), prev = $('prev'), status = $('status'),
      inpColor = $('color'), inpSinGuia = $('sinGuia'), selUnid = $('unidades');

  function setStatus(msg, type){
    status.textContent = msg;
    status.className = 'status' + (type ? ' ' + type : '');
  }
  function errMsg(e){ return (e && e.message) ? e.message : String(e); }

  // -- Configuracion persistente (se define una vez) ---------------
  function guardarCfg(){
    try {
      localStorage.setItem(LS, JSON.stringify({
        color: inpColor.value, sinGuia: inpSinGuia.checked, unidades: selUnid.value,
        elegidos: elegidos, extras: extras
      }));
    } catch(e){}
  }
  function cargarCfg(){
    try {
      var c = JSON.parse(localStorage.getItem(LS) || '{}');
      if (c.color) inpColor.value = c.color;
      if (c.sinGuia) inpSinGuia.checked = true;
      if (c.unidades) selUnid.value = c.unidades;
      if (Array.isArray(c.elegidos)) elegidos = c.elegidos;
      if (Array.isArray(c.extras)) extras = c.extras;
    } catch(e){}
  }

  function colorRGBA(){
    var h = (inpColor.value || '#00d4aa').replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return {
      r: parseInt(h.slice(0,2), 16) || 0,
      g: parseInt(h.slice(2,4), 16) || 0,
      b: parseInt(h.slice(4,6), 16) || 0,
      a: 255
    };
  }

  // Punto unico de la pieza, tal y como se escribe en la etiqueta.
  function fmtCoord(c){
    if (!c) return null;
    var r = function(n){ return Math.round(n * 1000) / 1000; };
    return r(c.x) + ", " + r(c.y) + ", " + r(c.z);
  }

  // -- Interfaz ----------------------------------------------------
  function updUI(){
    var n = sel.length;
    cnt.textContent = n;
    cnt.className = 'cnt' + (n === 0 ? ' z' : '');
    btnC.disabled = n === 0 || !API || running || elegidos.length === 0;
    sd.textContent = n === 0 ? 'nada seleccionado' : n === 1 ? '1 objeto seleccionado' : n + ' objetos seleccionados';
  }

  function marcado(q){ return elegidos.indexOf(q) >= 0; }

  function alternar(q, on){
    var i = elegidos.indexOf(q);
    if (on && i < 0) elegidos.push(q);
    if (!on && i >= 0) elegidos.splice(i, 1);
    guardarCfg();
    updPrev();
    updUI();
  }

  // Pinta la lista de parametros que la pieza tiene de verdad.
  function pintarProps(){
    propsBox.innerHTML = '';

    var m = metaActual || {};
    var filas = [
      { set: 'Objeto', name: 'CLASS', qualified: CLASS_OPT, value: m.CLASS },
      { set: 'Objeto', name: 'GUID',  qualified: GUID_OPT,  value: m.GUID },
      { set: 'Objeto', name: 'NAME',  qualified: NAME_OPT,  value: m.NAME },
      { set: 'Objeto', name: 'ID (objectRuntimeId)', qualified: ID_OPT, value: sel.length ? sel[0].rid : null },
      { set: 'Objeto', name: 'Punto único (X, Y, Z)', qualified: CENTRO_OPT, value: fmtCoord(centroActual) }
    ];
    var i;
    for (i = 0; i < available.length; i++) filas.push(available[i]);
    // Un parametro anadido a mano que ya esta en la lista no se repite.
    for (i = 0; i < extras.length; i++){
      var ex = String(extras[i]).toLowerCase(), dup = false;
      for (var d = 0; d < available.length; d++){
        if (String(available[d].qualified).toLowerCase() === ex || String(available[d].name).toLowerCase() === ex){ dup = true; break; }
      }
      if (dup) continue;
      filas.push({ set: 'Añadidos a mano', name: extras[i], qualified: extras[i], value: valorExtra(extras[i]) });
    }

    var grupos = [], porGrupo = {};
    for (i = 0; i < filas.length; i++){
      var f = filas[i];
      if (!porGrupo[f.set]){ porGrupo[f.set] = []; grupos.push(f.set); }
      porGrupo[f.set].push(f);
    }

    for (var g = 0; g < grupos.length; g++){
      var tit = document.createElement('div');
      tit.className = 'grp';
      tit.textContent = grupos[g];
      propsBox.appendChild(tit);

      var lista = porGrupo[grupos[g]];
      for (var k = 0; k < lista.length; k++){
        (function(f){
          var fila = document.createElement('label');
          fila.className = 'pr';
          var chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = marcado(f.qualified);
          chk.addEventListener('change', function(){ alternar(f.qualified, chk.checked); });
          var nom = document.createElement('span');
          nom.className = 'pr-n';
          nom.textContent = f.name;
          var val = document.createElement('span');
          val.className = 'pr-v';
          var v = (f.set === 'Objeto') ? (f.value == null ? '' : String(f.value)) : fmtVal(f.value);
          val.textContent = v === null ? '' : v;
          fila.appendChild(chk); fila.appendChild(nom); fila.appendChild(val);
          propsBox.appendChild(fila);
        })(lista[k]);
      }
    }

    if (!available.length && !sel.length){
      propsBox.innerHTML = '<div class="vacio">Selecciona una pieza para ver sus parámetros.</div>';
    }
  }

  function valorExtra(nombre){
    var v = matchValue(available, nombre);
    return v;
  }

  // Texto de la etiqueta, en el orden en que aparecen los parametros.
  function lineasDe(entries, obj, centro, meta){
    var orden = [CLASS_OPT, GUID_OPT, NAME_OPT, ID_OPT, CENTRO_OPT];
    var i;
    for (i = 0; i < available.length; i++) orden.push(available[i].qualified);
    for (i = 0; i < extras.length; i++) orden.push(extras[i]);
    // Cualquier elegido que no este en la lista visible tambien cuenta.
    for (i = 0; i < elegidos.length; i++) if (orden.indexOf(elegidos[i]) < 0) orden.push(elegidos[i]);

    var lineas = [], usados = {};
    for (i = 0; i < orden.length; i++){
      var q = orden[i];
      if (!marcado(q)) continue;
      // Evita repetir el mismo parametro si esta listado y anadido a mano.
      var clave = String(q).toLowerCase();
      var corta = clave.indexOf('/') >= 0 ? clave.slice(clave.indexOf('/') + 1) : clave;
      if (usados[corta]) continue;
      usados[corta] = 1;
      if (q === CLASS_OPT || q === GUID_OPT || q === NAME_OPT){
        var mm = meta || {};
        var mv = q === CLASS_OPT ? mm.CLASS : q === GUID_OPT ? mm.GUID : mm.NAME;
        if (mv) lineas.push(String(mv));
        continue;
      }
      if (q === ID_OPT){ lineas.push(String(obj.rid)); continue; }
      if (q === CENTRO_OPT){ var fc = fmtCoord(centro); if (fc) lineas.push(fc); continue; }
      var v = matchValue(entries, q);
      if (v !== null) lineas.push(v);
    }
    return lineas;
  }

  function updPrev(){
    if (!sel.length){ prev.textContent = '—'; return; }
    if (!elegidos.length){ prev.textContent = 'Marca al menos un parámetro.'; return; }
    var l = lineasDe(available, sel[0], centroActual, metaActual);
    prev.textContent = l.length ? l.join('\n') : '(la pieza no tiene esos parámetros)';
  }

  // -- Selección ---------------------------------------------------
  // Tolerante con las formas conocidas de devolver una seleccion.
  function parseSel(data){
    var out = [];
    var items = data;
    if (items && !Array.isArray(items)){
      if (Array.isArray(items.selection)) items = items.selection;
      else if (Array.isArray(items.objects)) items = items.objects;
      else items = [items];
    }
    if (!Array.isArray(items)) return out;

    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (it == null) continue;
      if (typeof it === 'number' || typeof it === 'string'){ out.push({ modelId: null, rid: it }); continue; }

      var mid = it.modelId != null ? it.modelId : it.modelID;

      if (Array.isArray(it.objects)){
        for (var j = 0; j < it.objects.length; j++){
          var o = it.objects[j];
          var r = o && (o.objectRuntimeId != null ? o.objectRuntimeId : o.id);
          if (r != null) out.push({ modelId: mid, rid: r });
        }
        continue;
      }

      var ids = it.objectRuntimeIds || it.objectRuntimeIDs || it.objectIds || it.ids;
      if (!ids && it.objectRuntimeId != null) ids = [it.objectRuntimeId];
      if (!ids && it.id != null) ids = [it.id];
      if (!Array.isArray(ids)) ids = ids != null ? [ids] : [];
      for (var k = 0; k < ids.length; k++) out.push({ modelId: mid, rid: ids[k] });
    }
    return out;
  }

  // Punto unico por el que entra cualquier cambio de seleccion, venga del evento
  // del visor o del sondeo. No dependemos de que el evento llegue.
  async function sincronizar(forzar){
    if (!API || running) return;
    var s;
    try {
      ultimaSelCruda = await API.viewer.getSelection();
      s = parseSel(ultimaSelCruda);
    } catch(e){ return; }

    var ids = s.map(function(o){ return o.modelId + ':' + o.rid; }).join(',');
    if (ids === selIds && !forzar) return;
    selIds = ids;
    sel = s;
    updUI();
    await loadProps(false);

    if (autoOn && sel.length && elegidos.length && ids !== lastIds){
      lastIds = ids;
      etiquetar();
    }
  }

  // -- Lectura de propiedades --------------------------------------
  function flatten(node, setName, out, depth){
    if (node == null || depth > 8) return;
    if (Array.isArray(node)){
      for (var i = 0; i < node.length; i++) flatten(node[i], setName, out, depth + 1);
      return;
    }
    if (typeof node !== 'object') return;
    var nm = typeof node.name === 'string' ? node.name : null;
    var isContainer = false;
    if (Array.isArray(node.properties)){ isContainer = true; flatten(node.properties, nm || setName, out, depth + 1); }
    if (Array.isArray(node.propertySets)){ isContainer = true; flatten(node.propertySets, nm || setName, out, depth + 1); }
    if (Array.isArray(node.attributes)){ isContainer = true; flatten(node.attributes, nm || setName, out, depth + 1); }
    if (nm && !isContainer && ('value' in node || 'displayValue' in node || 'nominalValue' in node)){
      var v = node.displayValue != null ? node.displayValue
            : node.value != null ? node.value
            : node.nominalValue;
      out.push({ set: setName || 'General', name: nm, value: v });
    }
  }

  function fmtVal(v){
    if (v == null) return null;
    if (typeof v === 'object'){
      if ('value' in v) return fmtVal(v.value);
      if ('displayValue' in v) return fmtVal(v.displayValue);
      return null;
    }
    if (typeof v === 'number'){
      if (!isFinite(v)) return null;
      return String(Math.round(v * 1000) / 1000);
    }
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    var s = String(v).trim();
    return s.length ? s : null;
  }

  // CLASS, GUID y NAME son metadatos del objeto: viven en la raiz de la
  // respuesta, no dentro de los property sets. El nombre del campo varia segun
  // el exportador, asi que se prueban los alias conocidos.
  function metaDe(raiz){
    var m = { CLASS: null, GUID: null, NAME: null };
    if (!raiz || typeof raiz !== 'object') return m;
    var s = function(v){
      if (typeof v === 'string' && v.trim()) return v.trim();
      if (typeof v === 'number' && isFinite(v)) return String(v);
      return null;
    };
    var p = (raiz.product && typeof raiz.product === 'object') ? raiz.product : {};
    m.CLASS = s(raiz['class']) || s(raiz.ifcClass) || s(raiz.className) || s(p['class']) || s(raiz.type);
    m.GUID  = s(raiz.guid) || s(raiz.globalId) || s(raiz.GlobalId) || s(raiz.ifcGuid) ||
              s(raiz.externalId) || s(p.guid) || s(p.globalId);
    m.NAME  = s(raiz.name) || s(p.name) || s(raiz.objectName);
    return m;
  }

  async function readEntries(modelId, rid){
    var props = await API.viewer.getObjectProperties(modelId, [rid]);
    var raiz = Array.isArray(props) ? props[0] : props;
    var entries = [];
    flatten(props, null, entries, 0);
    var seen = {}, out = [];
    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      e.qualified = e.set + '/' + e.name;
      if (seen[e.qualified.toLowerCase()]) continue;
      seen[e.qualified.toLowerCase()] = 1;
      out.push(e);
    }
    // Si el modelo no trae los metadatos en la raiz, se buscan entre las
    // propiedades: algunos exportadores los meten en un property set.
    var meta = metaDe(raiz);
    if (!meta.GUID)  meta.GUID  = matchValue(out, 'GUID') || matchValue(out, 'GlobalId') || matchValue(out, 'IfcGUID');
    if (!meta.NAME)  meta.NAME  = matchValue(out, 'NAME') || matchValue(out, 'Name');
    if (!meta.CLASS) meta.CLASS = matchValue(out, 'CLASS') || matchValue(out, 'IfcClass');
    out.meta = meta;
    out.raiz = raiz;
    return out;
  }

  // Busca "Pset/Propiedad" y, si no, el mismo nombre en cualquier otro pset.
  function matchValue(entries, target){
    var tq = String(target).toLowerCase();
    var tn = target.indexOf('/') >= 0 ? target.slice(target.indexOf('/') + 1).toLowerCase() : tq;
    var i, e, v;
    for (i = 0; i < entries.length; i++){
      e = entries[i];
      if (String(e.qualified).toLowerCase() === tq){
        v = fmtVal(e.value);
        if (v !== null) return v;
      }
    }
    for (i = 0; i < entries.length; i++){
      e = entries[i];
      if (String(e.name).toLowerCase() === tn){
        v = fmtVal(e.value);
        if (v !== null) return v;
      }
    }
    return null;
  }

  async function loadProps(anunciar){
    if (!API || !sel.length){
      available = []; centroActual = null; metaActual = null;
      pintarProps(); updPrev();
      return;
    }
    // El punto unico de la pieza, para poder mostrarlo y ofrecerlo como parametro.
    try { centroActual = await readCenter(sel[0].modelId, sel[0].rid); }
    catch(e){ centroActual = null; }
    try {
      available = await readEntries(sel[0].modelId, sel[0].rid);
      metaActual = available.meta || null;
      raizActual = available.raiz || null;
      pintarProps(); updPrev();
      if (anunciar){
        setStatus(available.length + ' parámetros leídos de la pieza.', available.length ? 'ok' : 'info');
      }
    } catch(e){
      available = []; metaActual = null;
      pintarProps(); updPrev();
      setStatus('No se pudieron leer los parámetros: ' + errMsg(e), 'err');
    }
  }

  // -- Punto del clic (viewer.onPicked) ----------------------------
  // No conocemos la forma exacta de la carga util, asi que se busca en
  // profundidad la primera terna de coordenadas, dando prioridad a las claves
  // que suenan a posicion.
  function coordsDe(o){
    if (!o || typeof o !== 'object') return null;
    var n = function(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; };
    var x = n(o.positionX), y = n(o.positionY), z = n(o.positionZ);
    if (x !== null && y !== null && z !== null) return { x: x, y: y, z: z };
    x = n(o.x); y = n(o.y); z = n(o.z);
    if (x !== null && y !== null && z !== null) return { x: x, y: y, z: z };
    return null;
  }

  function buscarPunto(o, prof){
    if (!o || typeof o !== 'object' || prof > 6) return null;
    var propio = coordsDe(o);
    if (propio) return propio;
    // Primero las claves con nombre de posicion, luego el resto.
    var pref = ['position', 'point', 'pickPoint', 'worldPosition', 'hitPoint', 'coordinates', 'location'];
    var k, r;
    for (k = 0; k < pref.length; k++){
      if (o[pref[k]]){ r = buscarPunto(o[pref[k]], prof + 1); if (r) return r; }
    }
    if (Array.isArray(o)){
      for (k = 0; k < o.length; k++){ r = buscarPunto(o[k], prof + 1); if (r) return r; }
      return null;
    }
    for (k in o){
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      if (pref.indexOf(k) >= 0) continue;
      r = buscarPunto(o[k], prof + 1);
      if (r) return r;
    }
    return null;
  }

  function buscarIds(o, prof, acc){
    acc = acc || {};
    if (!o || typeof o !== 'object' || prof > 6) return acc;
    if (acc.modelId == null && typeof o.modelId === 'string') acc.modelId = o.modelId;
    if (acc.rid == null){
      if (o.objectRuntimeId != null) acc.rid = o.objectRuntimeId;
      else if (Array.isArray(o.objectRuntimeIds) && o.objectRuntimeIds.length) acc.rid = o.objectRuntimeIds[0];
    }
    for (var k in o){
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      if (acc.modelId != null && acc.rid != null) break;
      buscarIds(o[k], prof + 1, acc);
    }
    return acc;
  }

  // -- Posición 3D: centro del bounding box ------------------------
  function num(v){ return typeof v === 'number' ? v : Number(v); }

  async function readCenter(modelId, rid){
    var boxes = await API.viewer.getObjectBoundingBoxes(modelId, [rid]);
    var arr = Array.isArray(boxes) ? boxes : [boxes];
    var entry = null;
    for (var i = 0; i < arr.length; i++){
      if (arr[i] && (String(arr[i].id) === String(rid) || String(arr[i].objectRuntimeId) === String(rid))){ entry = arr[i]; break; }
    }
    var dudosa = false;
    if (!entry){
      if (arr.length === 1){ entry = arr[0]; dudosa = true; }   // sin id que casar
      else throw new Error('la caja devuelta no corresponde al objeto ' + rid);
    }
    var bb = entry.boundingBox || entry.bbox || entry;
    var min = bb && bb.min, max = bb && bb.max;
    if (!min || !max) throw new Error('bounding box sin min/max');
    var c = {
      x: (num(min.x) + num(max.x)) / 2,
      y: (num(min.y) + num(max.y)) / 2,
      z: (num(min.z) + num(max.z)) / 2
    };
    if (!isFinite(c.x) || !isFinite(c.y) || !isFinite(c.z)) throw new Error('coordenadas no numéricas');
    var dx = Math.abs(num(max.x) - num(min.x)),
        dy = Math.abs(num(max.y) - num(min.y)),
        dz = Math.abs(num(max.z) - num(min.z));
    var tam = Math.max(dx, dy, dz);
    // Si la caja no venia identificada puede ser la del modelo entero: usar su
    // tamano para separar el texto daria una linea guia gigante.
    c.sep = dudosa ? 0.5 : (isFinite(tam) && tam > 0 ? tam * 0.35 : 0.5);
    c.topZ = num(max.z);
    if (!isFinite(c.topZ)) c.topZ = c.z;
    c.dudosa = dudosa;   // la caja no venia identificada: puede ser la del modelo
    return c;
  }

  // -- API de markup -----------------------------------------------
  function markupApi(){
    if (API && API.markup && typeof API.markup.addTextMarkup === 'function') return API.markup;
    if (API && API.viewer && API.viewer.markup && typeof API.viewer.markup.addTextMarkup === 'function') return API.viewer.markup;
    return null;
  }

  async function leerMarkups(mk){
    var fns = ['getTextMarkups', 'getMarkups', 'getAllMarkups'];
    for (var i = 0; i < fns.length; i++){
      if (typeof mk[fns[i]] === 'function'){
        try {
          var r = await mk[fns[i]]();
          if (Array.isArray(r)) return r;
        } catch(e){}
      }
    }
    return null;
  }

  // Forma confirmada leyendo un markup guardado por este host:
  //   start/end -> { type:'point', positionX, positionY, positionZ }
  // El punto necesita ademas modelId y objectId: son los que le dicen al visor
  // a que objeto pertenece la coordenada. Se quitaron en v8 al ver que el markup
  // releido no los devolvia, pero que no se devuelvan al leer no significa que
  // no hagan falta al escribir: sin ellos el visor resuelve el punto en el
  // origen del proyecto.
  // La geometria del visor (bounding boxes, onPicked) viene en metros, pero la
  // API de markup no tiene por que usar la misma unidad: si espera milimetros y
  // le enviamos metros, cualquier punto del modelo cae a menos de un centimetro
  // del origen y todas las etiquetas parecen estar en el 0,0,0.
  function factorUnidad(){
    var f = parseFloat(selUnid.value);
    return (isFinite(f) && f > 0) ? f : 1;
  }

  function pick(x, y, z, modelId, objectId){
    var f = factorUnidad();
    return {
      type: 'point',
      positionX: x * f, positionY: y * f, positionZ: z * f,
      modelId: modelId, objectId: objectId
    };
  }

  // start = ancla sobre el elemento; end = donde flota el texto. La separacion
  // es proporcional al tamano de la pieza, para que la linea guia se vea igual
  // de bien en un tornillo que en un muro.
  function construirMarkup(texto, c, obj){
    var mid = obj ? obj.modelId : null, oid = obj ? obj.rid : null;
    return {
      text: texto,
      color: colorRGBA(),
      start: pick(c.x, c.y, c.z, mid, oid),
      end:   inpSinGuia.checked ? pick(c.x, c.y, c.z, mid, oid)
                                : pick(c.x, c.y, c.topZ + c.sep, mid, oid)
    };
  }

  function posFinDe(m){
    var p = m && (m.end || m.endPoint);
    if (!p || typeof p !== 'object') return null;
    var x = p.positionX !== undefined ? p.positionX : p.x;
    var y = p.positionY !== undefined ? p.positionY : p.y;
    var z = p.positionZ !== undefined ? p.positionZ : p.z;
    if (x === undefined || x === null) return null;
    var r = function(n){ return typeof n === 'number' ? Math.round(n * 1000) / 1000 : n; };
    return r(x) + ', ' + r(y) + ', ' + r(z);
  }

  function posDe(m){
    var p = m && (m.start || m.startPoint || m.position || m);
    if (!p || typeof p !== 'object') return null;
    var g = function(a, b){
      if (p[a] !== undefined && p[a] !== null) return p[a];
      if (p.position && p.position[b] !== undefined) return p.position[b];
      if (p[b] !== undefined && p[b] !== null) return p[b];
      return null;
    };
    var x = g('positionX','x'), y = g('positionY','y'), z = g('positionZ','z');
    if (x === null && y === null && z === null) return null;
    return [x, y, z].join(',');
  }

  // -- Etiquetado ---------------------------------------------------
  async function etiquetar(){
    if (!API || sel.length === 0 || running) return;
    if (!elegidos.length){ setStatus('Marca al menos un parámetro.', 'err'); return; }

    var mk = markupApi();
    if (!mk){ setStatus('La API de markup no está disponible.', 'err'); return; }

    running = true; updUI();
    setStatus('Etiquetando ' + sel.length + ' pieza(s)…', 'info');

    // Cada pieza tiene como mucho una etiqueta: se retira la anterior antes de
    // poner la nueva, para no acumular duplicados al recorrer el modelo.
    var previas = [], cl;
    for (var pz = 0; pz < sel.length; pz++){
      cl = sel[pz].modelId + ':' + sel[pz].rid;
      if (etiquetaDe[cl] != null){ previas.push(etiquetaDe[cl]); delete etiquetaDe[cl]; }
    }
    if (previas.length && typeof mk.removeMarkups === 'function'){
      try { await mk.removeMarkups(previas); } catch(e){}
      creados = creados.filter(function(id){ return previas.indexOf(id) < 0; });
    }

    var antesArr = await leerMarkups(mk);
    var antes = antesArr === null ? null : antesArr.length;

    var markups = [], duenos = [], errPrep = 0, sinDatos = 0, centros = {}, repetidas = 0, conPick = 0, anclaInfo = '';

    for (var i = 0; i < sel.length; i++){
      var obj = sel[i];
      try {
        // Cada pieza lee SUS parametros y SU caja. El centro primero, porque
        // puede formar parte del propio texto de la etiqueta.
        var c = await readCenter(obj.modelId, obj.rid);
        // Si el visor nos dio el punto exacto del clic sobre esta pieza, ese
        // manda: viene ya en el espacio correcto y pertenece al elemento.
        var fuente = 'caja';
        if (ultimoPick && (ultimoPick.rid == null || String(ultimoPick.rid) === String(obj.rid))){
          c.x = ultimoPick.x; c.y = ultimoPick.y; c.z = ultimoPick.z;
          c.topZ = ultimoPick.z;
          conPick++; fuente = 'clic';
        }
        if (!anclaInfo){
          var fu = factorUnidad();
          anclaInfo = fmtCoord(c) + ' m (' + fuente + ')';
          if (fu !== 1) anclaInfo += ' → enviado ×' + fu + ': ' +
            Math.round(c.x * fu) + ', ' + Math.round(c.y * fu) + ', ' + Math.round(c.z * fu);
        }
        var entries = [];
        try { entries = await readEntries(obj.modelId, obj.rid); } catch(e){ entries = []; }
        var lineas = lineasDe(entries, obj, c, entries.meta);
        if (!lineas.length){ lineas = ['ID: ' + obj.rid]; sinDatos++; }
        var clave = c.x + '|' + c.y + '|' + c.z;
        if (centros[clave]) repetidas++; else centros[clave] = 1;

        markups.push(construirMarkup(lineas.join('\n'), c, obj));
        duenos.push(obj.modelId + ':' + obj.rid);
      } catch(e){
        errPrep++;
      }
    }

    var ok = 0, errEnvio = 0, ultimoError = '';
    if (markups.length){
      try {
        await mk.addTextMarkup(markups);
        ok = markups.length;
      } catch(e){
        ultimoError = errMsg(e);
        for (var k = 0; k < markups.length; k++){
          try { await mk.addTextMarkup([markups[k]]); ok++; }
          catch(e2){ errEnvio++; ultimoError = errMsg(e2); }
        }
      }
    }

    // Comprueba lo que el visor guardo de verdad.
    var guardados = await leerMarkups(mk);
    var despues = guardados === null ? null : guardados.length;
    var reales = (antes !== null && despues !== null) ? (despues - antes) : null;

    var avisoPos = '';
    if (guardados && guardados.length && markups.length){
      var nuestros = guardados.slice(-markups.length), k2;
      for (k2 = 0; k2 < nuestros.length; k2++){
        if (nuestros[k2] && nuestros[k2].id != null){
          creados.push(nuestros[k2].id);
          if (duenos[k2]) etiquetaDe[duenos[k2]] = nuestros[k2].id;
        }
      }
      var posSet = {}, nPos = 0;
      for (k2 = 0; k2 < nuestros.length; k2++){
        var pz = posDe(nuestros[k2]);
        if (pz === null) continue;
        if (!posSet[pz]){ posSet[pz] = 1; nPos++; }
      }
      if (nuestros.length > 1 && nPos <= 1){
        avisoPos = nPos === 1
          ? '\n⚠ el visor guardó 1 sola posición para las ' + nuestros.length + ': ' + posDe(nuestros[0])
          : '\n⚠ no se pudo leer la posición guardada.';
        avisoPos += '\nPulsa «Diagnóstico de markup» y envía el volcado.';
      }
    }

    var fallos = errPrep + errEnvio;
    var msg = (reales !== null)
      ? reales + ' de ' + sel.length + ' etiquetas creadas'
      : ok + ' enviadas, ' + fallos + ' fallo(s)';
    if (anclaInfo) msg += '\nAncla usada: ' + anclaInfo;
    if (conPick) msg += ' · ' + conPick + '/' + markups.length + ' por clic';
    else if (markups.length) msg += ' · sin punto de clic disponible';
    if (sinDatos) msg += ' · ' + sinDatos + ' sin esos parámetros (se usó el ID)';
    if (repetidas) msg += ' · ⚠ ' + repetidas + ' comparten posición';
    msg += avisoPos;
    if (ultimoError) msg += '\n' + ultimoError;

    var mal = fallos > 0 || repetidas > 0 || avisoPos !== '';
    setStatus(msg, mal ? 'err' : sinDatos ? 'info' : 'ok');

    running = false; updUI();
  }

  async function borrarEtiquetas(){
    var mk = markupApi();
    if (!mk){ setStatus('La API de markup no está disponible.', 'err'); return; }
    if (typeof mk.removeMarkups !== 'function'){
      setStatus('Este visor no expone removeMarkups. Bórralas desde la barra de markup de Trimble.', 'err');
      return;
    }
    try {
      if (creados.length) await mk.removeMarkups(creados.slice());
      else await mk.removeMarkups();
      setStatus('Etiquetas borradas.', 'ok');
      creados = []; etiquetaDe = {};
    } catch(e){
      setStatus('No se pudieron borrar: ' + errMsg(e), 'err');
    }
  }

  // -- Conexión -----------------------------------------------------
  // Acepta cualquier evento de seleccion, se llame como se llame en este host.
  function onEvent(ev, data){
    if (eventos.indexOf(ev) < 0){ eventos.push(ev); if (eventos.length > 25) eventos.shift(); }
    // Guardamos la carga util: si algun evento trae la coordenada del clic,
    // aparecera aqui y podremos anclar la etiqueta en la superficie pinchada.
    try {
      var d = JSON.stringify(data);
      var tope = /markup/i.test(String(ev)) ? 700 : 260;
      if (d && d.length > tope) d = d.slice(0, tope) + '…';
      eventosDetalle.push(ev + ' → ' + d);
    } catch(err){ eventosDetalle.push(ev + ' → (no serializable)'); }
    if (eventosDetalle.length > 10) eventosDetalle.shift();
    if (/pick/i.test(String(ev))){
      var pt = buscarPunto(data, 0);
      if (pt){
        var ids = buscarIds(data, 0, {});
        ultimoPick = { x: pt.x, y: pt.y, z: pt.z, modelId: ids.modelId, rid: ids.rid, ts: Date.now() };
      }
    }
    if (!/selection|select/i.test(String(ev))) return;
    if (selTimer) clearTimeout(selTimer);
    selTimer = setTimeout(function(){ selTimer = null; sincronizar(false); }, 350);
  }

  async function init(){
    try {
      API = await TrimbleConnectWorkspace.connect(window.parent, onEvent, 15000);
      dot.classList.add('ok');
      setStatus(markupApi()
        ? 'Conectado. Marca los parámetros y haz clic en una pieza.'
        : 'Conectado, pero la API de markup no está disponible.', markupApi() ? 'ok' : 'err');

      await sincronizar(true);

      // El evento de seleccion no llega en todos los hosts, asi que ademas
      // sondeamos: es lo que hace que "etiquetar al hacer clic" funcione siempre.
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(function(){ sincronizar(false); }, 1000);
    } catch(e){
      dot.classList.add('err');
      setStatus('Error al conectar: ' + errMsg(e), 'err');
    }
    updUI();
  }

  // -- Eventos ------------------------------------------------------
  inpColor.addEventListener('change', function(){ guardarCfg(); });
  inpSinGuia.addEventListener('change', function(){ guardarCfg(); });
  selUnid.addEventListener('change', function(){ guardarCfg(); });

  $('btnAdd').addEventListener('click', function(){
    var v = $('custom').value.trim();
    if (!v) return;
    if (extras.indexOf(v) < 0) extras.push(v);
    if (elegidos.indexOf(v) < 0) elegidos.push(v);
    $('custom').value = '';
    guardarCfg(); pintarProps(); updPrev(); updUI();
  });
  $('custom').addEventListener('keydown', function(e){
    if (e.key === 'Enter') $('btnAdd').click();
  });

  btnC.addEventListener('click', function(){ etiquetar(); });
  $('btnX').addEventListener('click', function(){ borrarEtiquetas(); });

  $('btnR').addEventListener('click', async function(){
    if (!API){ setStatus('Sin conexión con Trimble Connect.', 'err'); return; }
    try {
      await sincronizar(true);
      await loadProps(true);
    } catch(e){ setStatus('Error al recargar: ' + errMsg(e), 'err'); }
  });

  $('auto').addEventListener('change', function(e){
    autoOn = e.target.checked;
    $('badge').classList.toggle('on', autoOn);
    lastIds = '';
    setStatus(autoOn ? 'Se etiquetará al hacer clic en una pieza.' : 'Etiquetado manual: usa el botón.', 'info');
  });

  $('btnD').addEventListener('click', async function(){
    var mk = markupApi();
    if (!mk){ setStatus('No hay API de markup en este contexto.', 'err'); return; }
    setStatus('Leyendo…', 'info');
    try {
      var partes = [];

      // -- Selección: lo primero, porque si esto falla no hay etiquetas --
      var cruda = null;
      try { cruda = await API.viewer.getSelection(); } catch(e){ cruda = 'ERROR: ' + errMsg(e); }
      var crudaTxt = JSON.stringify(cruda);
      if (crudaTxt && crudaTxt.length > 400) crudaTxt = crudaTxt.slice(0, 400) + '…';
      partes.push('getSelection(): ' + crudaTxt);
      partes.push('Piezas interpretadas: ' + parseSel(cruda).length + ' · en panel: ' + sel.length);
      partes.push('Eventos recibidos: ' + (eventos.length ? eventos.join(', ') : 'NINGUNO'));
      partes.push('Último clic (onPicked): ' + (ultimoPick
        ? ultimoPick.x + ', ' + ultimoPick.y + ', ' + ultimoPick.z + '  rid=' + ultimoPick.rid
        : 'NINGUNO capturado'));
      partes.push('API: ' + Object.keys(API).join(', '));
      if (API.viewer) partes.push('API.viewer: ' + Object.keys(API.viewer).join(', '));
      if (eventosDetalle.length){
        partes.push('Últimos eventos con datos:');
        for (var q = 0; q < eventosDetalle.length; q++) partes.push('  ' + eventosDetalle[q]);
      }
      if (sel.length){
        try {
          var bbRaw = await API.viewer.getObjectBoundingBoxes(sel[0].modelId, [sel[0].rid]);
          var bbTxt = JSON.stringify(bbRaw);
          if (bbTxt && bbTxt.length > 320) bbTxt = bbTxt.slice(0, 320) + '…';
          partes.push('boundingBox crudo: ' + bbTxt);
        } catch(e2){ partes.push('boundingBox crudo: ERROR ' + errMsg(e2)); }
      }
      if (raizActual && typeof raizActual === 'object'){
        partes.push('getObjectProperties raíz: ' + Object.keys(raizActual).join(', '));
        var mm = metaActual || {};
        partes.push('CLASS=' + (mm.CLASS || '(no encontrado)') +
                    ' · GUID=' + (mm.GUID || '(no encontrado)') +
                    ' · NAME=' + (mm.NAME || '(no encontrado)'));
      }
      partes.push('');

      var guardados = await leerMarkups(mk);
      partes.push('API.markup: ' + Object.keys(mk).join(', '));
      if (guardados === null){
        partes.push('El host no expone ningún lector de markups.');
      } else if (!guardados.length){
        partes.push('No hay markups guardados. Crea una etiqueta y vuelve a pulsar.');
      } else {
        var ult = guardados[guardados.length - 1];
        partes.push('Total guardados: ' + guardados.length);
        partes.push('Claves del markup: ' + Object.keys(ult).join(', '));
        var lista = guardados.slice(-12), posSet = {}, nd = 0;
        partes.push('Guardadas (start = ancla, end = texto):');
        for (var i = 0; i < lista.length; i++){
          var p = posDe(lista[i]);
          var pf = posFinDe(lista[i]);
          if (p !== null && !posSet[p]){ posSet[p] = 1; nd++; }
          partes.push('  "' + String(lista[i].text).replace(/\n/g, ' | ') + '"');
          partes.push('     start: ' + (p === null ? '(ilegible)' : p));
          partes.push('     end:   ' + (pf === null ? '(ilegible)' : pf));
        }
        partes.push(nd + ' posiciones distintas de ' + lista.length + ' etiquetas.');
      }
      setStatus(partes.join('\n'), 'info');
    } catch(e){
      setStatus('Diagnóstico falló: ' + errMsg(e), 'err');
    }
  });

  window.addEventListener('error', function(e){
    setStatus('Error de JavaScript: ' + (e.message || 'desconocido'), 'err');
  });

  cargarCfg();
  pintarProps();
  $('ver').textContent = 'Extensión de Trimble Connect · ' + VERSION;
  init();
})();
</script>
</body>
</html>
